; --- 策略组定义 ---
; 定义两个不同的兜底组
custom_proxy_group=🐟 房间兜底`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=🐟 全家兜底`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

; 其他独立组保持不变
custom_proxy_group=🛩️ 手机`select`[]DIRECT`.*
custom_proxy_group=电视`select`[]DIRECT`.*
custom_proxy_group=🏡 房间`select`[]DIRECT`.*

; --- 规则定义 ---
enable_rule_generator=true
overwrite_original_rules=true

; 1. 先给特定设备分配组（认人）
custom_rule=- SRC-IP-CIDR,192.168.5.24/32,🛩️ 手机
custom_rule=- SRC-IP-CIDR,192.168.5.27/32,电视
custom_rule=- SRC-IP-CIDR,192.168.5.128/25,🏡 房间

; 2. 【核心】设置房间的专属兜底
; 只要是房间这个 IP 段（128/25）里没被识别的流量，全部挡在这里，去“房间兜底”组
custom_rule=- SRC-IP-CIDR,192.168.5.128/25,🐟 房间兜底

; 3. 最后的全家总兜底
; 剩下的所有流量（手机、电视里没认出来的，或者新设备的流量）掉进这里
ruleset=🐟 全家兜底,[]FINAL
