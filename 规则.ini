;策略组定义
;总开关：包含所有子组。如果你想一直 REJECT，在界面里手动选中 REJECT 即可
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]REJECT`[]🛩️ 手机`[]🏡 房间`[]🇭🇰 客厅电脑`[]电视`[]妈妈和彩萍`[]国外`[]国内`[]♻️ 自动选择

;以下为各个独立选择组
;DIRECT 已全部置于节点正则表达式 .* 之前
custom_proxy_group=🛩️ 手机`select`[]DIRECT`.*`[]REJECT
;【注意】你说房间不要 DIRECT，所以这里保持纯节点，末尾已补齐反引号
custom_proxy_group=🏡 房间`select`.*`
custom_proxy_group=🇭🇰 客厅电脑`select`[]DIRECT`.*`[]REJECT
custom_proxy_group=电视`select`[]DIRECT`.*`[]REJECT
custom_proxy_group=妈妈和彩萍`select`[]DIRECT`.*`[]REJECT
custom_proxy_group=国外`select`[]DIRECT`.*`[]REJECT
custom_proxy_group=国内`select`[]DIRECT`.*`[]REJECT

;自动测速组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,2

;启用自定义规则集
enable_rule_generator=true
overwrite_original_rules=true

;规则集定义
ruleset=🐟 漏网之鱼,[]FINAL
