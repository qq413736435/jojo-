;--- 1. 自动测速组 ---
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,2

;--- 2. 定义两个真正的“兜底出口” ---
; 房间专属兜底
custom_proxy_group=🚪 房间兜底`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
; 全局漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

;--- 3. 设备组 (通过嵌套实现“房间”独立兜底) ---
; 核心修改：房间组不再直接选节点，而是【嵌套】房间兜底，并作为它的第一选项
custom_proxy_group=🏡 房间`select`[]🚪 房间兜底`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

; 其他组保持不变
custom_proxy_group=🛩️ 手机`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=🇭🇰 客厅电脑`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=电视`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=妈妈和彩萍`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=国外`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=国内`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

;--- 4. 规则定义 ---
enable_rule_generator=true
overwrite_original_rules=true

; 逻辑实现：
; 1. 如果你有专门针对房间的规则集，请写在这里，并指向 []🚪 房间兜底
; ruleset=🚪 房间兜底,https://raw.githubusercontent.com/...房间专用规则.list

; 2. 全局最终兜底 (针对除了房间规则以外的所有流量)
ruleset=🐟 漏网之鱼,[]FINAL
