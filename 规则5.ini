;--- 1. 自动测速组 ---
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,2

;--- 2. 定义两个兜底逻辑组 ---
; 房间专用兜底
custom_proxy_group=🏠 房间专属兜底`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
; 全局其他组兜底
custom_proxy_group=🐟 漏网之鱼`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

;--- 3. 独立设备组 ---
; 【关键修改】让房间组默认指向它的专属兜底组
custom_proxy_group=🏡 房间`select`[]🏠 房间专属兜底`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

; 其他组保持独立
custom_proxy_group=🛩️ 手机`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=🇭🇰 客厅电脑`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=电视`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*
custom_proxy_group=妈妈和彩萍`select`[]DIRECT`[]REJECT`[]♻️ 自动选择`.*

;--- 4. 规则定义 ---
enable_rule_generator=true
overwrite_original_rules=true

; 这里的逻辑是：
; 1. 你所有在面板上选了“🏡 房间”组的流量，其“内部默认出口”就是“🏠 房间专属兜底”。
; 2. 剩下的所有未被规则捕获的流量（FINAL），全部掉进“🐟 漏网之鱼”。

ruleset=🐟 漏网之鱼,[]FINAL
